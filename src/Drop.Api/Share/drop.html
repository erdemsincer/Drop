<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{OG_TITLE}}</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Drop">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta name="description" content="{{OG_DESCRIPTION}}">
<meta name="theme-color" content="#120D24">
<style>
  :root { --night:#120D24; --night2:#231A45; --lime:#C8F53C; --primary:#6D4AFF; --text:#14121F; --muted:#686779; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(160deg, var(--night2), var(--night)); color:#fff; font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:900; font-size:22px; letter-spacing:-0.5px; }
  .brand svg { width:28px; height:28px; }
  .card { width:100%; max-width:420px; margin-top:28px; background:#fff; color:var(--text); border-radius:26px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.35); }
  .hero { padding:22px 22px 18px; background:linear-gradient(135deg, {{TINT}}38, {{TINT}}10); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:{{TINT}}; color:#fff; font-size:12px; font-weight:800; letter-spacing:0.4px; }
  .where { margin-top:14px; font-weight:800; }
  .branch { color:var(--muted); font-size:14px; font-weight:600; }
  .body { padding:18px 22px 24px; }
  h1 { margin:0; font-size:24px; line-height:1.25; letter-spacing:-0.5px; }
  .desc { margin:8px 0 0; color:var(--muted); }
  .stats { display:flex; gap:10px; margin-top:18px; }
  .stat { flex:1; background:#F4F4F8; border-radius:16px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:12px; font-weight:700; }
  .cta { display:block; margin-top:20px; padding:16px; border-radius:16px; background:var(--night); color:#fff; text-align:center; font-weight:900; text-decoration:none; }
  .cta i { color:var(--lime); font-style:normal; }
  .hint { margin-top:12px; color:var(--muted); font-size:13px; text-align:center; }
  .gone { padding:28px 22px; text-align:center; }
  .gone h1 { font-size:22px; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="12 12 76 84" aria-hidden="true"><path fill="#C8F53C" fill-rule="evenodd" d="M50 93C43 81 19 66 19 42A31 31 0 0 1 81 42C81 66 57 81 50 93ZM56 19L36 47L48 47L44 66L65 37L53 37Z"/></svg>
    drop
  </div>
  <div class="card">
{{CARD}}
  </div>
<script>
  // Live countdown; the server already rendered a value, so this is only polish.
  (function () {
    var el = document.getElementById('left');
    if (!el) return;
    var end = Date.parse(el.getAttribute('data-ends'));
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
      var s = Math.max(0, Math.floor((end - Date.now()) / 1000));
      var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      el.textContent = s === 0 ? 'Bitti' : (h > 0 ? h + ':' + pad(m) + ':' + pad(s % 60) : pad(m) + ':' + pad(s % 60));
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
