<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Drop</title>
<style>
  :root { --bg:#F4F4F8; --surface:#FFFFFF; --text:#14121F; --muted:#686779; --primary:#6D4AFF; --border:#E7E6EF; --head:#120D24; --lime:#C8F53C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E0B1A; --surface:#1A1530; --text:#F4F3FA; --muted:#A9A7BD; --primary:#A08BFF; --border:#2B2547; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:var(--head); color:#fff; padding:28px 16px 36px; }
  header .wrap, main { max-width:760px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:900; font-size:20px; letter-spacing:-0.5px; }
  .brand svg { width:26px; height:26px; }
  h1 { margin:18px 0 4px; font-size:28px; line-height:1.2; letter-spacing:-0.6px; }
  .updated { color:rgba(255,255,255,0.65); font-size:14px; }
  main { padding:8px 16px 48px; }
  section { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:4px 20px 12px; margin-top:16px; }
  h2 { font-size:18px; margin:18px 0 6px; letter-spacing:-0.2px; }
  p, li { color:var(--text); }
  ul { padding-left:20px; }
  li { margin:4px 0; }
  .muted { color:var(--muted); font-size:14px; }
  a { color:var(--primary); }
  table { width:100%; border-collapse:collapse; font-size:14px; margin:8px 0 12px; }
  th, td { text-align:left; vertical-align:top; padding:8px 6px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="12 12 76 84" aria-hidden="true"><path fill="#C8F53C" fill-rule="evenodd" d="M50 93C43 81 19 66 19 42A31 31 0 0 1 81 42C81 66 57 81 50 93ZM56 19L36 47L48 47L44 66L65 37L53 37Z"/></svg>
      drop
    </div>
    <h1>{{TITLE}}</h1>
    <div class="updated">Son güncelleme: {{UPDATED}}</div>
  </div>
</header>
<main>
{{BODY}}
</main>
</body>
</html>
