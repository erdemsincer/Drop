name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Integration tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test Drop.slnx --configuration Release

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/Drop.Mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/Drop.Mobile/package-lock.json

      - run: npm ci

      # Typed routes (.expo/types) are generated by the dev server and not committed.
      - name: Generate typed routes
        run: |
          (CI=1 npx expo start --offline > /tmp/expo.log 2>&1 &)
          for i in $(seq 1 120); do [ -f .expo/types/router.d.ts ] && break; sleep 1; done
          pkill -f "expo start" || true
          test -f .expo/types/router.d.ts || (cat /tmp/expo.log; exit 1)

      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t drop-api .
